<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" fill="#071233" rx="12"/>
  <g font-family="Segoe UI, Roboto, Arial" fill="#fff" font-size="14">
    <rect x="60" y="40" width="260" height="100" rx="10" fill="#1e40af" />
    <text x="190" y="95" text-anchor="middle" font-weight="700">Web Client (React + Vite)</text>

    <rect x="460" y="40" width="260" height="100" rx="10" fill="#0ea5a4" />
    <text x="590" y="95" text-anchor="middle" font-weight="700">WebSocket / API Gateway</text>

    <rect x="860" y="40" width="260" height="100" rx="10" fill="#ef4444" />
    <text x="990" y="95" text-anchor="middle" font-weight="700">Inference Services / ML</text>

    <rect x="460" y="200" width="260" height="80" rx="8" fill="#7c3aed" />
    <text x="590" y="245" text-anchor="middle" font-weight="700">Optional DB / Storage</text>

    <line x1="320" y1="90" x2="460" y2="90" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />
    <line x1="720" y1="90" x2="860" y2="90" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />
    <line x1="590" y1="140" x2="590" y2="200" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />

    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#fff"/>
      </marker>
    </defs>
  </g>
</svg>